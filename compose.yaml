name: midis-sql-ai

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "14330:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" > /dev/null 2>&1 || exit 1'
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    restart: unless-stopped

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      READONLY_DB_PASSWORD: "${READONLY_DB_PASSWORD}"

    volumes:
      - ./database:/scripts:ro

    entrypoint:
      - /bin/bash
      - /scripts/init-database.sh

    restart: "no"

  backend:
    build:
      context: ./backend/MidisSqlAi.Api
      dockerfile: Dockerfile

    depends_on:
      database-init:
        condition: service_completed_successfully

    environment:
      ASPNETCORE_ENVIRONMENT: "Container"
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MidisSqlAiDb;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=15;Application Name=MidisSqlAi.Api;"

      ConnectionStrings__ReadOnlyConnection: "Server=sqlserver,1433;Database=MidisSqlAiDb;User ID=midis_ai_reader;Password=${READONLY_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=15;Application Name=MidisSqlAi.Api;"

      AzureOpenAI__Endpoint: "${AZURE_OPENAI_ENDPOINT}"
      AzureOpenAI__ApiKey: "${AZURE_OPENAI_API_KEY}"
      AzureOpenAI__DeploymentName: "${AZURE_OPENAI_DEPLOYMENT_NAME}"

    ports:
      - "8080:8080"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    depends_on:
      backend:
        condition: service_started

    ports:
      - "3000:80"

    restart: unless-stopped

volumes:
  sqlserver-data: